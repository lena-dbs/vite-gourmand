
<div id="erd" style="overflow-x:auto"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const diagram = `erDiagram
  role {
    int role_id PK
    varchar libelle
  }
  utilisateur {
    int utilisateur_id PK
    int role_id FK
    varchar email
    varchar password
    varchar nom
    varchar prenom
    varchar telephone
    varchar adresse
    varchar ville
    varchar code_postal
  }
  password_reset {
    int token_id PK
    int utilisateur_id FK
    varchar token
    datetime expires_at
    tinyint used
  }
  theme {
    int theme_id PK
    varchar libelle
  }
  regime {
    int regime_id PK
    varchar libelle
  }
  menu {
    int menu_id PK
    int theme_id FK
    int regime_id FK
    varchar titre
    text description
    int nb_personne_min
    decimal prix_base
    int stock
    varchar image
  }
  condition_menu {
    int condition_id PK
    int menu_id FK
    text description
  }
  plat {
    int plat_id PK
    varchar nom
    varchar type
    varchar photo
  }
  menu_plat {
    int menu_id FK
    int plat_id FK
  }
  allergene {
    int allergene_id PK
    varchar libelle
  }
  plat_allergene {
    int plat_id FK
    int allergene_id FK
  }
  commande {
    int commande_id PK
    int utilisateur_id FK
    int menu_id FK
    int nb_personne
    date date_livraison
    varchar adresse_livraison
    decimal prix_menu
    decimal prix_reduction
    decimal prix_livraison
    decimal prix_total
    boolean pret_materiel
    boolean restitution_materiel
  }
  suivi_commande {
    int suivi_id PK
    int commande_id FK
    varchar statut
    text commentaire
    datetime created_at
  }
  avis {
    int avis_id PK
    int commande_id FK
    int utilisateur_id FK
    int note
    text commentaire
    varchar statut
    datetime created_at
  }
  horaire {
    int horaire_id PK
    varchar jour
    varchar heure_ouverture
    varchar heure_fermeture
  }

  role ||--o{ utilisateur : "possede"
  utilisateur ||--o{ password_reset : "reinitialise"
  utilisateur ||--o{ commande : "passe"
  utilisateur ||--o{ avis : "publie"
  theme ||--o{ menu : "categorise"
  regime ||--o{ menu : "adapte"
  menu ||--o{ condition_menu : "a pour condition"
  menu ||--o{ menu_plat : "compose"
  plat ||--o{ menu_plat : "compose"
  plat ||--o{ plat_allergene : "contient"
  allergene ||--o{ plat_allergene : "contient"
  commande ||--o{ suivi_commande : "possede"
  commande ||--o| avis : "donne lieu a"
  menu ||--o{ commande : "concerne"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;
</script>
